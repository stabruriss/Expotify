name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare release notes
        id: release_notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            cat "$NOTES_FILE" > /tmp/release-notes.md
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" \
              --jq .body > /tmp/release-notes.md
          fi

          DELIMITER="$(uuidgen)"
          {
            echo "body<<${DELIMITER}"
            cat /tmp/release-notes.md
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify release secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build Tauri app
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Nan Wu (FHG4VDYX2S)"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build

      - name: Sign bundled vendor binaries
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Nan Wu (FHG4VDYX2S)"
        run: |
          APP_BUNDLE="src-tauri/target/release/bundle/macos/Expotify.app"
          VENDOR_DIR="$APP_BUNDLE/Contents/Resources/node_modules/@anthropic-ai/claude-agent-sdk/vendor"

          if [ -d "$VENDOR_DIR" ]; then
            while IFS= read -r -d '' file; do
              if file "$file" | grep -q "Mach-O"; then
                echo "Signing bundled executable: $file"
                codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$file"
                codesign --verify --strict --verbose=2 "$file"
              fi
            done < <(find "$VENDOR_DIR" -type f -print0)
          fi

          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          # Gatekeeper assessment is deferred until after the DMG is notarized and stapled.

      - name: Rebuild signed DMG
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Nan Wu (FHG4VDYX2S)"
        run: |
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          APP_DIR="src-tauri/target/release/bundle/macos"
          DMG=$(find "$DMG_DIR" -maxdepth 1 -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG found after Tauri build"
            exit 1
          fi

          rm -f "$DMG"
          "$DMG_DIR/bundle_dmg.sh" \
            --volname "Expotify" \
            --volicon "$DMG_DIR/icon.icns" \
            --window-size 660 400 \
            --icon-size 100 \
            --icon "Expotify.app" 180 170 \
            --hide-extension "Expotify.app" \
            --app-drop-link 480 170 \
            --codesign "$APPLE_SIGNING_IDENTITY" \
            "$DMG" \
            "$APP_DIR"

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${{ github.ref_name }}"
          DMG=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)
          RELEASE_DMG="/tmp/Expotify_${VERSION}.dmg"

          if [ -z "$DMG" ]; then
            echo "::error::No DMG found to notarize"
            exit 1
          fi

          cp "$DMG" "$RELEASE_DMG"
          xcrun notarytool submit "$RELEASE_DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_PASSWORD" \
            --wait
          xcrun stapler staple "$RELEASE_DMG"
          xcrun stapler validate "$RELEASE_DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$RELEASE_DMG"
          shasum -a 256 "$RELEASE_DMG"

      - name: Publish GitHub release
        run: |
          VERSION="${{ github.ref_name }}"
          RELEASE_DMG="/tmp/Expotify_${VERSION}.dmg"

          if [ ! -f "$RELEASE_DMG" ]; then
            echo "::error::Missing notarized release DMG: $RELEASE_DMG"
            exit 1
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" \
              --title "Expotify $VERSION" \
              --notes-file /tmp/release-notes.md
            gh release upload "$VERSION" "$RELEASE_DMG" --clobber
          else
            gh release create "$VERSION" "$RELEASE_DMG" \
              --title "Expotify $VERSION" \
              --notes-file /tmp/release-notes.md \
              --verify-tag
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
